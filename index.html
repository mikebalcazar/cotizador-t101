<style>
/* Las cifras van en Fira Sans, no en Sansation: Sansation es de la marca.

  content: '';

/* ─── Orbs flotantes (frosted globes) — fijos en viewport ─── */
.float-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(40px);
  pointer-events: none;
  z-index: -1;
  mix-blend-mode: screen;
}
.float-orb.orb-1 {
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(0,200,230,0.55) 0%, rgba(0,128,193,0.2) 60%, transparent 80%);
  top: -100px; left: -120px;
  animation: orbDrift1 28s ease-in-out infinite alternate;
}
.float-orb.orb-2 {
  width: 320px; height: 320px;
  background: radial-gradient(circle, rgba(198,255,61,0.35) 0%, rgba(100,180,80,0.15) 50%, transparent 80%);

  animation: orbDrift2 34s ease-in-out infinite alternate;

  width: 280px; height: 280px;
  background: radial-gradient(circle, rgba(80,130,220,0.45) 0%, rgba(60,90,180,0.18) 55%, transparent 80%);
  top: 40%; right: 8%;
  animation: orbDrift3 40s ease-in-out infinite alternate;

@keyframes orbDrift1 {
  0%   { transform: translate(0, 0) scale(1); }
  33%  { transform: translate(320px, 240px) scale(1.15); }
  66%  { transform: translate(160px, 560px) scale(0.95); }
  100% { transform: translate(480px, 320px) scale(1.08); }

  33%  { transform: translate(-360px, -200px) scale(1.12); }
  66%  { transform: translate(-160px, -480px) scale(0.92); }

@keyframes orbDrift3 {
  0%   { transform: translate(0, 0) scale(1); }
  33%  { transform: translate(-240px, 320px) scale(1.18); }
  66%  { transform: translate(-400px, -160px) scale(0.9); }

/* Cards frosted — aplica a cualquier elemento con bg blanco usando data-frost o inline */
.frost {
  background: rgba(255, 255, 255, 0.72) !important;
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.5) !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.7) !important;
}

/* Animación "vacuum" al archivar — el bloque se encoge y vuela hacia el botón de archivos */
@keyframes vacuumToArchive {
  0% {
    transform: translate(0, 0) scale(1) rotate(0deg);
    opacity: 1;
  }
  30% {
    transform: translate(calc(var(--vacuum-dx) * 0.15), calc(var(--vacuum-dy) * 0.15)) scale(0.92) rotate(2deg);
    opacity: 0.95;
  }
  100% {
    transform: translate(var(--vacuum-dx), var(--vacuum-dy)) scale(0.05) rotate(20deg);
    opacity: 0;
  }
}
.cliente-block.archivando {
  animation: vacuumToArchive 0.5s cubic-bezier(0.55, 0.0, 0.7, 0.15) forwards;
  pointer-events: none;
  z-index: 100;
}
.cliente-block:not(.activo):hover {
  box-shadow:
    0 0 0 1px rgba(150,230,255,0.3),
    0 0 18px rgba(150,230,255,0.35),
    0 0 40px rgba(150,230,255,0.22),
    0 0 70px rgba(150,230,255,0.12),
    0 10px 36px rgba(0,0,0,0.15),
    inset 0 1px 0 rgba(255,255,255,0.65) !important;
  background: rgba(255,255,255,0.36) !important;
  border-color: rgba(255,255,255,0.5) !important;
}

/* Indicadores neón */
.neon-circle {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: transparent;
  border: 2px solid #0080C1;
  flex-shrink: 0;
  transition: border-color 0.5s cubic-bezier(0.4, 0.0, 0.2, 1) 0.15s, box-shadow 0.5s cubic-bezier(0.4, 0.0, 0.2, 1) 0.15s;
  display: inline-block;
}
.neon-circle.active {
  border-color: #C6FF3D;
  animation: neonStrobe 0.55s linear, neonPulse 1.8s ease-in-out infinite 0.55s;
  transition: border-color 0.2s ease;
}
@keyframes neonStrobe {
  0%   { box-shadow: 0 0 0 rgba(198,255,61,0); border-color:#C6FF3D; }
  15%  { box-shadow: 0 0 22px 6px rgba(255,255,255,1), 0 0 50px 16px rgba(198,255,61,1), inset 0 0 16px rgba(255,255,255,0.95); border-color:#fff; }
  100% {
    box-shadow:
      0 0 4px rgba(198,255,61,0.9),
      0 0 10px rgba(198,255,61,0.7),
      0 0 18px rgba(198,255,61,0.5),
      0 0 28px rgba(198,255,61,0.3),
      inset 0 0 6px rgba(198,255,61,0.5);
    border-color:#C6FF3D;
  }
}
@keyframes neonPulse {
  0%, 100% {
    box-shadow:
      0 0 3px rgba(198,255,61,0.7),
      0 0 8px rgba(198,255,61,0.5),
      0 0 14px rgba(198,255,61,0.35),
      0 0 22px rgba(198,255,61,0.2),
      inset 0 0 4px rgba(198,255,61,0.4);
  }
  50% {
    box-shadow:
      0 0 8px rgba(198,255,61,1),
      0 0 18px rgba(198,255,61,0.95),
      0 0 32px rgba(198,255,61,0.75),
      0 0 48px rgba(198,255,61,0.5),
      inset 0 0 10px rgba(198,255,61,0.75);
  }
}

/* Animaciones de despliegue */
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.anim-slideDown { animation: slideDown 0.46s cubic-bezier(0.4, 0.0, 0.2, 1) forwards; }
.anim-fadeInUp { animation: fadeInUp 0.4s ease forwards; }

<!-- ── Pantalla de arranque ─────────────────────────────────────────────────
  La pidió Mike el 14-sep-2026: «un splash bonito tipo los de draw101 y
  nest101 para cuando está cargando». Misma idea que draw101/electron/
  cargando.html: una hoja —aquí una cotización— flotando en perspectiva que se
  va trazando sola mientras la app trae los datos, y la marca encima.

  Dos redes de seguridad que el letrero anterior no tenía:
  · Trae SU PROPIO fondo oscuro. El letrero viejo era texto blanco sin fondo:
    si la app no arrancaba, la pantalla se veía en blanco (pasó el 14-sep en
    un iPhone). Ahora, aunque no corra ni una línea de JavaScript, se ve la
    marca y «Cargando».
  · Si a los 8 s no ha cargado lo dice, y a los 20 s ofrece «Reintentar».

  La app la quita llamando window.splash101.ocultar() cuando ya trajo los
  datos (o cuando falló al traerlos: en ambos casos hay pantalla que enseñar).
  Mientras tanto puede cambiar el renglón de estado con splash101.estado("…").
──────────────────────────────────────────────────────────────────────────── -->

<script>
  // La app manda avances con splash101.estado("…") y la quita con splash101.ocultar().
  (function () {
    var caja = document.getElementById("splash101");
    var linea = document.getElementById("splash101-estado");
    var boton = document.getElementById("splash101-reintentar");
    var desde = Date.now();
    var fuera = false;
    function estado(t) {
      if (fuera) return;
      linea.innerHTML = "";
      linea.appendChild(document.createTextNode(t + " "));
      for (var i = 0; i < 3; i++) linea.appendChild(document.createElement("i"));
    }
    function ocultar() {
      if (fuera) return;
      fuera = true;
      // que la hoja alcance a trazarse: mínimo 1,4 s en pantalla
      var falta = Math.max(0, 1400 - (Date.now() - desde));
      setTimeout(function () {
        caja.classList.add("fuera");
        setTimeout(function () { if (caja.parentNode) caja.parentNode.removeChild(caja); }, 400);
      }, falta);
    }
    setTimeout(function () { if (!fuera) { caja.classList.add("aviso"); estado("Sigue cargando… revisa tu conexión"); } }, 8000);
    setTimeout(function () { if (!fuera) { caja.classList.add("aviso"); estado("No se pudo cargar"); boton.hidden = false; } }, 20000);
    window.splash101 = { estado: estado, ocultar: ocultar };
  })();
</script>

<script>
/* quote101 guarda en la suite 101. Ya no en Firebase.
 *
 * Aquí vivía `window.firebaseDB`, que le hablaba a Firestore con la llave
 * pública metida en esta misma página: quien la leyera podía leer y escribir
 * los doce clientes sin pasar por ninguna puerta. La pantalla de entrada del
 * 16-sep tapó el camino de la aplicación, no ése. Esto es lo que lo cierra.
 *
 * Lo que la app ve NO cambia: las mismas seis funciones, los mismos datos de
 * entrada y salida. Por eso React no se tocó. Lo que cambió es a quién le
 * hablan, y que ahora hablan por `/s101/*` —el mismo origen, con la galleta de
 * sesión de la suite— en vez de a `firestore.googleapis.com` con una llave a
 * la vista.
 *
 * Se llama `suiteDB` y no `firebaseDB`. El nombre viejo apuntando a la suite
 * habría sido una trampa para el siguiente que lo lea.
 *
 * CÓMO SE REPARTE EL ÁRBOL
 *
 * La app trabaja con un árbol en memoria: clientes → proyectos → cotizaciones
 * → versiones → muebles. La suite tiene una tabla por nivel hasta la
 * cotización; las versiones van enteras en su campo `datos`, que es el cajón de
 * quote101 y nadie más lo lee.
 *
 * LOS IDS LOS PONE LA SUITE
 *
 * La app inventaba ids con `uid()`. Ahora, cuando algo se crea, el id lo
 * devuelve la suite y **se le escribe encima al objeto del árbol**. No es un
 * capricho: la suite no deja que una app elija el id de un cliente o de un
 * proyecto (`permisos.ts`), y tener dos identidades para la misma cosa —una en
 * la pantalla y otra en la base— es la clase de cosa que se descubre el día que
 * algo no se borra.
 *
 * EL ESPEJO
 *
 * `guardar` recibe el árbol COMPLETO cada vez: la app no sabe qué cambió. Para
 * no reescribir las trescientas cosas en cada tecleo, se guarda una huella de
 * lo que la suite tenía la última vez que se leyó o se escribió, y sólo se
 * manda lo que difiere. Lo que ya no está en el árbol se borra, de abajo hacia
 * arriba: cotización, proyecto, cliente. Al revés la suite contesta 409, y con
 * razón.
 *
 * EL DINERO
 *
 * La columna `total` de la cotización es centavos ENTEROS. Los montos de la app
 * son pesos con decimales. Se convierte con texto y no con `Math.round(v*100)`,
 * y se multiplica por la cantidad DESPUÉS de convertir: `10.005 × 4` en
 * flotantes da 40.02 → 4002 centavos, y convertir primero da 1001 × 4 = 4004.
 * Los dos centavos de diferencia no están en ningún renglón.
 *
 * LAS FOTOS
 *
 * Las que se capturan nuevas llegan como base64. Se suben a la suite
 * (`POST /orgs/:o/archivos`, que las guarda en R2) y en el árbol se deja la
 * dirección. Antes iban a Firebase Storage con URL pública; ahora la dirección
 * pide sesión.
 *
 * Y ya no hay que recomprimir en cascada: eso existía porque Firestore no deja
 * pasar un documento de más de 1 MB y el árbol entero iba en UN documento. Aquí
 * cada cotización es su propio renglón y las fotos no van dentro. Se fueron
 * cuatro niveles de recompresión que degradaban las fotos para que el documento
 * cupiera.
 */

const API = '/s101';

/** Una petición a la suite. Devuelve `{estado, data, error}`; no tira salvo que
 *  la red se caiga. Un 401 quiere decir que la sesión se venció mientras la
 *  pestaña estaba abierta: se manda a la puerta, porque insistir con una sesión
 *  muerta sólo produce errores que no dicen nada. */
async function pedir(ruta, opciones = {}) {
  const r = await fetch(API + ruta, {
    method: opciones.method || 'GET',
    headers: opciones.cuerpo ? { 'Content-Type': 'application/json' } : undefined,
    body: opciones.cuerpo ? JSON.stringify(opciones.cuerpo) : opciones.forma,
    credentials: 'same-origin',
  });
  if (r.status === 401) {
    location.href = '/entrar.html';
    throw new Error('sesión vencida');
  }
  const cuerpo = await r.json().catch(() => ({}));
  return { estado: r.status, ...cuerpo };
}

/* ─────────────── quién soy y en qué empresa ─────────────── */

let ORG = null;
let NEGOCIO = null;
let NEGOCIOS = [];

/* EN QUÉ NEGOCIO. La suite guarda clientes, proyectos y cotizaciones POR
 * NEGOCIO, y una empresa puede tener varios. Hasta el 23-sep-2026 el cotizador
 * abría siempre el primero de la lista —que viene ordenada por nombre— sin
 * recordar nada y sin manera de cambiarlo.
 *
 * Eso quiere decir que el día que alguien da de alta un negocio cuyo nombre
 * queda antes en el abecedario, el cotizador se cambia solo de negocio y todo
 * se ve VACÍO. No se perdió nada: está en el otro. Pero desde la pantalla no
 * hay forma de saberlo, y se lee como «desapareció mi información». Mike lo
 * reportó así.
 *
 * Los precios y la configuración NO se mueven, porque `ajustes` no se guarda
 * por negocio: es de la empresa y de la app. Por eso el síntoma es tan raro
 * —los precios siguen ahí y los clientes no— y por eso sirve para reconocerlo.
 *
 * Ahora se recuerda el que se escogió y, cuando hay más de uno, la barra de
 * arriba deja cambiarlo. */
const LLAVE_NEG = 'quote101:negocio';
const guardarLocal = (k, v) => { try { localStorage.setItem(k, v); } catch { /* modo privado */ } };
const leerLocal = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

async function identidad() {
  if (ORG && NEGOCIO) return true;
  const yo = await pedir('/yo');
  /* En qué empresa trabaja esta cuenta.
   *
   * `orgs` son las MEMBRESÍAS de quien entró. Para Mike y para Fer hay una y
   * es la suya. Puede venir vacía en un caso real: una cuenta de dueño de la
   * suite —superadmin— alcanza cualquier empresa pero no es miembro de
   * ninguna, así que esta lista le llega vacía.
   *
   * Cuando eso pasa no hay nada que adivinar, y lo importante es NO quedarse
   * callado: una app vacía se lee como «no tienes clientes», que es otra cosa
   * muy distinta y manda a buscar el problema donde no está. */
  ORG = yo.data?.orgs?.[0]?.id || null;
  if (!ORG) {
    alert(
      'Tu cuenta entró a la suite, pero no está dada de alta en ninguna empresa, '
      + 'así que el cotizador no tiene de dónde traer tus clientes.\n\n'
      + 'Si eres la cuenta de dueño de la suite, entra con tu cuenta de la empresa. '
      + 'Si no, pídele a quien administra la empresa que te agregue.',
    );
    throw new Error('la cuenta no es miembro de ninguna empresa');
  }

  const negs = await pedir(`/orgs/${ORG}/negocios`);
  /* UN ERROR NO ES «NO HAY NEGOCIOS», y confundirlos sale caro: antes, si esta
   * lectura fallaba por lo que fuera —la empresa sin pago, la app apagada, un
   * 500, la red a medias—, `negs.data` venía vacío, el cotizador lo leía como
   * «esta empresa no tiene negocios» y CREABA UNO. Una lectura que falla no
   * puede terminar en una escritura que nadie pidió. */
  if (negs.estado !== 200 || !Array.isArray(negs.data?.filas)) {
    throw new Error('no se pudo leer la lista de negocios: ' + (negs.error || negs.estado));
  }
  NEGOCIOS = negs.data.filas;

  if (!NEGOCIOS.length) {
    // Una empresa recién hecha no tiene ninguno. El cotizador puede crear el
    // suyo —sólo el nombre y la moneda— justo para no quedarse trabado
    // esperando a otra app. Ahora sí: la lista llegó bien y venía vacía.
    const nuevo = await pedir(`/orgs/${ORG}/negocios`, {
      method: 'POST', cuerpo: { nombre: yo.data?.orgs?.[0]?.nombre || 'Taller 101', moneda: 'MXN' },
    });
    NEGOCIO = nuevo.data?.id || null;
    if (!NEGOCIO) throw new Error('no se pudo crear el negocio: ' + (nuevo.error || nuevo.estado));
    NEGOCIOS = [{ id: NEGOCIO, nombre: nuevo.data?.nombre ?? 'Taller 101' }];
  } else {
    /* El que se escogió la vez pasada. Si ya no existe —o nunca se escogió
     * ninguno— se abre el primero, como siempre; lo que cambia es que a partir
     * de ahí se queda donde la persona lo dejó. */
    const recordado = NEGOCIOS.find((n) => n.id === leerLocal(LLAVE_NEG));
    NEGOCIO = (recordado || NEGOCIOS[0]).id;
  }
  guardarLocal(LLAVE_NEG, NEGOCIO);
  return true;
}

/* ─────────────── el dinero ─────────────── */

/** Pesos con decimales → centavos enteros, sin flotantes.
 *
 *  `Math.round(v * 100)` parece lo mismo y no lo es: 20000.005 * 100 da
 *  2000000.4999999998 y redondea para abajo, o sea se pierde medio centavo. Con
 *  texto no hay nada que perder. Es la misma regla que aplica la API
 *  (`aCentavosExacto`), a propósito: si las dos no coincidieran, el total que
 *  la app enseña y el que la suite guarda se separarían. */
function aCentavos(valor) {
  if (valor === null || valor === undefined || valor === '') return 0;
  const texto = typeof valor === 'number'
    ? (Number.isFinite(valor) ? valor.toFixed(10) : 'no-es-numero')
    : String(valor).replace(/[\s $,]/g, '');
  // Un monto que NO se puede leer truena, no vale cero. Devolver cero dejaría
  // que un renglón con basura se guardara como gratis sin que nadie viera un
  // error: el total sólo saldría más bajo. Así truena, `guardar` devuelve false
  // y la app avisa. Vacío sí es cero, arriba: un campo que nadie llenó no vale.
  if (!/^[+-]?\d*(\.\d*)?$/.test(texto) || !/\d/.test(texto)) {
    throw new Error('monto que no se puede leer: ' + String(valor));
  }
  const negativo = texto.startsWith('-');
  const [entero = '0', decimales = ''] = texto.replace(/^[+-]/, '').split('.');
  const cent = (decimales + '00').slice(0, 2);
  const tercero = Number(decimales[2] || 0);
  let n = Number(entero || 0) * 100 + Number(cent || 0);
  if (tercero >= 5) n += 1;               // se redondea al centavo de arriba
  return negativo ? -n : n;
}

/** El total de una cotización, en centavos: la versión vigente (la 0), precio
 *  por pieza convertido y multiplicado después por la cantidad. */
function totalDe(cot) {
  const vigente = (cot.versiones || [])[0] || {};
  return (vigente.muebles || []).reduce((suma, m) => {
    const qty = Number.isInteger(Number(m.qty)) ? Number(m.qty) : 1;
    return suma + aCentavos(m.total) * (qty >= 0 ? qty : 0);
  }, 0);
}

/* ─────────────── las fotos ─────────────── */

/** Sube una foto nueva y devuelve su dirección en la suite. Las que ya son
 *  dirección se dejan como están: subirlas otra vez dejaría copias y haría
 *  cada guardado más lento que el anterior. */
async function subirFoto(b64, cotizacion_id) {
  const m = /^data:(image\/[\w+.-]+);base64,(.+)$/.exec(b64 || '');
  if (!m) return b64;
  const binario = atob(m[2]);
  const bytes = new Uint8Array(binario.length);
  for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
  const ext = (m[1].split('/')[1] || 'jpg').replace('jpeg', 'jpg');
  const forma = new FormData();
  forma.append('archivo', new File([bytes], `mueble-${Date.now()}.${ext}`, { type: m[1] }));
  forma.append('de_tabla', 'cotizaciones');
  forma.append('de_id', cotizacion_id || 'sin-cotizacion');
  const r = await pedir(`/orgs/${ORG}/archivos`, { method: 'POST', forma });
  if (r.estado !== 201 || !r.data?.id) throw new Error('no se pudo guardar una foto: ' + (r.error || r.estado));
  return `${API}/orgs/${ORG}/archivos/${r.data.id}`;
}

/* ─────────────── el espejo ─────────────── */

/* Huella de lo que la suite tenía la última vez. Si la huella no cambió, no se
 * manda nada: `guardar` recibe el árbol completo en cada tecleo. */
const espejo = { clientes: new Map(), proyectos: new Map(), cotizaciones: new Map() };

const huellaCliente = (c) => JSON.stringify({ nombre: c.nombre || '' });
const huellaProyecto = (p, cliente_id) => JSON.stringify({ nombre: p.nombre || '', cliente_id });
const huellaCotizacion = (q, cliente_id, proyecto_id) => JSON.stringify({
  cliente_id, proyecto_id, total: totalDe(q),
  datos: { nombre: q.nombre || null, proyecto_id, versiones: q.versiones || [] },
});

/* ─────────────── la interfaz que la app conoce ─────────────── */

window.suiteDB = {
  /** El árbol, armado de las tres tablas. */
  async cargar() {
    try {
      await identidad();
      const [cls, prs, cots, ajs] = await Promise.all([
        pedir(`/orgs/${ORG}/clientes?negocio_id=${encodeURIComponent(NEGOCIO)}`),
        pedir(`/orgs/${ORG}/proyectos?negocio_id=${encodeURIComponent(NEGOCIO)}`),
        pedir(`/orgs/${ORG}/cotizaciones?negocio_id=${encodeURIComponent(NEGOCIO)}`),
        pedir(`/orgs/${ORG}/ajustes`),
      ]);

      const porProyecto = new Map();
      for (const q of (cots.data?.filas || [])) {
        const datos = q.datos || {};
        const cot = { id: q.id, nombre: datos.nombre || 'Cotización', folio: q.folio, versiones: datos.versiones || [], estado: q.estado || 'borrador', aprobacion: datos.aprobacion || null };
        const pid = datos.proyecto_id || '';
        if (!porProyecto.has(pid)) porProyecto.set(pid, []);
        porProyecto.get(pid).push(cot);
      }

      const porCliente = new Map();
      for (const p of (prs.data?.filas || [])) {
        const proy = { id: p.id, nombre: p.nombre, cotizaciones: porProyecto.get(p.id) || [] };
        if (!porCliente.has(p.cliente_id)) porCliente.set(p.cliente_id, []);
        porCliente.get(p.cliente_id).push(proy);
      }

      const clientes = (cls.data?.filas || [])
        .map((c) => ({ id: c.id, nombre: c.nombre, proyectos: porCliente.get(c.id) || [] }));

      /* El espejo se llena RECORRIENDO EL ÁRBOL QUE SE ENTREGA, no las listas
       * que llegaron. La diferencia no es de estilo: `guardar` borra lo que
       * está en el espejo y no está en el árbol. Si el espejo llevara una fila
       * que el árbol no incluyó —una cotización cuyo `proyecto_id` apunta a un
       * proyecto que no existe, por ejemplo— el siguiente guardado la borraría
       * sin que nadie la hubiera visto ni pedido.
       *
       * La regla queda así: **en el espejo sólo hay lo que se le enseñó a la
       * pantalla.** Lo que no se enseñó, `guardar` no lo puede tocar. */
      espejo.clientes.clear(); espejo.proyectos.clear(); espejo.cotizaciones.clear();
      for (const c of clientes) {
        espejo.clientes.set(c.id, huellaCliente(c));
        for (const p of c.proyectos) {
          espejo.proyectos.set(p.id, huellaProyecto(p, c.id));
          for (const q of p.cotizaciones) espejo.cotizaciones.set(q.id, huellaCotizacion(q, c.id, p.id));
        }
      }

      const porClave = {};
      for (const a of (ajs.data?.filas || [])) porClave[a.clave] = a.valor;

      return { clientes, config: porClave.config || null, prices: porClave.precios || null };
    } catch (e) {
      console.error('cargar:', e);
      // Vacío y no a medias: enseñar la mitad del árbol y dejar que alguien
      // guarde encima borraría lo que no se alcanzó a leer.
      return { clientes: [], config: null, prices: null };
    }
  },

  /** El árbol completo. Se manda sólo lo que cambió, y se borra lo que ya no
   *  está. Devuelve `false` si algo falló: la app avisa y no marca guardado. */
  async guardar(clientes) {
    try {
      await identidad();

      const vistos = { clientes: new Set(), proyectos: new Set(), cotizaciones: new Set() };

      for (const c of clientes) {
        /* Cliente. Si es nuevo, el id lo pone la suite y se le escribe encima
         * al objeto del árbol: la app vuelve a guardar ese mismo objeto y el id
         * tiene que ser el de la base, no el inventado en memoria. */
        if (!espejo.clientes.has(c.id)) {
          const r = await pedir(`/orgs/${ORG}/clientes`, {
            method: 'POST', cuerpo: { nombre: c.nombre || 'Cliente', negocio_id: NEGOCIO },
          });
          if (r.estado !== 201) throw new Error('cliente: ' + (r.error || r.estado));
          c.id = r.data.id;
        } else if (espejo.clientes.get(c.id) !== huellaCliente(c)) {
          const r = await pedir(`/orgs/${ORG}/clientes/${c.id}`, { method: 'PATCH', cuerpo: { nombre: c.nombre || 'Cliente' } });
          if (r.estado !== 200) throw new Error('cliente: ' + (r.error || r.estado));
        }
        espejo.clientes.set(c.id, huellaCliente(c));
        vistos.clientes.add(c.id);

        for (const p of (c.proyectos || [])) {
          if (!espejo.proyectos.has(p.id)) {
            const r = await pedir(`/orgs/${ORG}/proyectos`, {
              method: 'POST', cuerpo: { nombre: p.nombre || 'Proyecto', cliente_id: c.id, negocio_id: NEGOCIO },
            });
            if (r.estado !== 201) throw new Error('proyecto: ' + (r.error || r.estado));
            p.id = r.data.id;
          } else if (espejo.proyectos.get(p.id) !== huellaProyecto(p, c.id)) {
            const r = await pedir(`/orgs/${ORG}/proyectos/${p.id}`, {
              method: 'PATCH', cuerpo: { nombre: p.nombre || 'Proyecto', cliente_id: c.id },
            });
            if (r.estado !== 200) throw new Error('proyecto: ' + (r.error || r.estado));
          }
          espejo.proyectos.set(p.id, huellaProyecto(p, c.id));
          vistos.proyectos.add(p.id);

          for (const q of (p.cotizaciones || [])) {
            // Las fotos nuevas se suben ANTES de comparar la huella: si se
            // comparara primero, una cotización a la que sólo se le agregó una
            // foto se vería igual y la foto no subiría nunca.
            for (const v of (q.versiones || [])) {
              for (const m of (v.muebles || [])) {
                // El plano del armador (Mike, 23-sep) sube igual que las fotos:
                // en `datos` sólo queda su dirección, nunca la imagen entera.
                if (m.plano && typeof m.plano.src === 'string' && m.plano.src.startsWith('data:image')) {
                  m.plano.src = await subirFoto(m.plano.src, q.id);
                }
                if (!Array.isArray(m.imagenes)) continue;
                for (let i = 0; i < m.imagenes.length; i++) {
                  if (typeof m.imagenes[i] === 'string' && m.imagenes[i].startsWith('data:image')) {
                    // Se escribe en el arreglo del árbol, no en una copia: así
                    // la app se queda con la dirección y no vuelve a subir la
                    // misma foto en el siguiente guardado.
                    m.imagenes[i] = await subirFoto(m.imagenes[i], q.id);
                  }
                }
              }
            }

            const nueva = !espejo.cotizaciones.has(q.id);
            const huella = huellaCotizacion(q, c.id, p.id);
            if (nueva) {
              const r = await pedir(`/orgs/${ORG}/cotizaciones`, {
                method: 'POST',
                cuerpo: {
                  negocio_id: NEGOCIO, cliente_id: c.id, total: totalDe(q), moneda: 'MXN',
                  datos: { nombre: q.nombre || null, proyecto_id: p.id, versiones: q.versiones || [] },
                },
              });
              if (r.estado !== 201) throw new Error('cotización: ' + (r.error || r.estado));
              q.id = r.data.id;
              // El folio lo asigna la suite, no el navegador. Se guarda en el
              // árbol para poder enseñarlo sin volver a preguntar.
              q.folio = r.data.folio;
            } else if (espejo.cotizaciones.get(q.id) !== huella) {
              const r = await pedir(`/orgs/${ORG}/cotizaciones/${q.id}`, {
                method: 'PATCH',
                cuerpo: {
                  cliente_id: c.id, total: totalDe(q),
                  datos: { nombre: q.nombre || null, proyecto_id: p.id, versiones: q.versiones || [] },
                },
              });
              if (r.estado !== 200) throw new Error('cotización: ' + (r.error || r.estado));
            }
            espejo.cotizaciones.set(q.id, huellaCotizacion(q, c.id, p.id));
            vistos.cotizaciones.add(q.id);
          }
        }
      }

      /* Lo que ya no está en el árbol se borró en la pantalla. Se va de abajo
       * hacia arriba —cotización, proyecto, cliente—: al revés la suite
       * contesta 409 porque quedan filas apuntando, y con razón. */
      for (const id of [...espejo.cotizaciones.keys()]) {
        if (vistos.cotizaciones.has(id)) continue;
        const r = await pedir(`/orgs/${ORG}/cotizaciones/${id}`, { method: 'DELETE' });
        if (r.estado === 200 || r.estado === 404) espejo.cotizaciones.delete(id);
        else throw new Error('borrar cotización: ' + (r.error || r.estado));
      }
      for (const id of [...espejo.proyectos.keys()]) {
        if (vistos.proyectos.has(id)) continue;
        const r = await pedir(`/orgs/${ORG}/proyectos/${id}`, { method: 'DELETE' });
        if (r.estado === 200 || r.estado === 404) espejo.proyectos.delete(id);
        else throw new Error('borrar proyecto: ' + (r.error || r.estado));
      }
      for (const id of [...espejo.clientes.keys()]) {
        if (vistos.clientes.has(id)) continue;
        const r = await pedir(`/orgs/${ORG}/clientes/${id}`, { method: 'DELETE' });
        if (r.estado === 200 || r.estado === 404) espejo.clientes.delete(id);
        else throw new Error('borrar cliente: ' + (r.error || r.estado));
      }

      return true;
    } catch (e) {
      console.error('guardar:', e);
      return false;
    }
  },

  async guardarConfig(config) {
    return guardarAjuste('config', config);
  },

  async guardarPrices(prices) {
    return guardarAjuste('precios', prices);
  },

  /** El siguiente número de recibo, sin apartarlo: la pantalla lo enseña antes
   *  de que alguien confirme. Si se apartara al abrir, cada vez que alguien se
   *  asomara y cerrara se iría un número. */
  async leerFolioActual() {
    try {
      await identidad();
      const r = await pedir(`/orgs/${ORG}/folios/REC`);
      return String(r.data?.siguiente ?? 1).padStart(4, '0');
    } catch (e) {
      console.error('leerFolioActual:', e);
      return '0001';
    }
  },

  /** «¿No te refieres a X?» — los clientes de la empresa que se parecen a ese
   *  nombre (contrato 0.23.0 de la suite).
   *
   *  Mike, 20-sep: «si se quiere crear un cliente con el nombre ya existente,
   *  preguntar si no te estás refiriendo a X cliente».
   *
   *  La regla NO se escribe aquí: la contesta la API. quote101, dash101 y
   *  quell101 preguntan lo mismo, y tres copias de una regla son tres reglas
   *  —la que falle va a ser la que nadie probó—. Además, aquí sólo está el
   *  árbol de ESTE negocio, y la API mira a toda la empresa.
   *
   *  Si la API no contesta, se devuelve vacío a propósito: el aviso es una
   *  ayuda, y una ayuda que no carga no puede impedir dar de alta un cliente. */
  /** Los negocios de la empresa, y en cuál está parado el cotizador.
   *
   *  La pantalla los necesita para poder ofrecer el cambio: sin eso, quien
   *  tiene dos negocios no tiene manera de llegar al otro, y lo que hay ahí se
   *  lee como perdido. */
  negocios() { return NEGOCIOS.map((n) => ({ id: n.id, nombre: n.nombre })); },
  negocioActual() { return NEGOCIO; },

  /** Cambiar de negocio. No trae nada por su cuenta: quien lo llama vuelve a
   *  pedir `cargar()`, porque el árbol entero es de un negocio. */
  cambiarNegocio(id) {
    if (!NEGOCIOS.some((n) => n.id === id)) return false;
    NEGOCIO = id;
    guardarLocal(LLAVE_NEG, id);
    return true;
  },

  /** El catálogo de productos del negocio, para «Buscar en catálogo» en la
   *  hoja. Es la misma tabla `productos` que usa dash101 (contrato 0.35.0).
   *  Aquí sólo se lee: guardar en el catálogo desde el cotizador llega con el
   *  catálogo de conceptos. Un error NO se vuelve «catálogo vacío»: la hoja
   *  lo dice, para que nadie crea que no hay productos cuando no se pudo
   *  preguntar. */
  async productos() {
    await identidad();
    const r = await pedir(`/orgs/${ORG}/productos?negocio_id=${encodeURIComponent(NEGOCIO)}&limite=5000`);
    if (r.estado !== 200 || !Array.isArray(r.data?.filas)) throw new Error(r.error || String(r.estado));
    return r.data.filas;
  },

  /** Aprueba la cotización: la suite crea sus piezas vendidas en el
   *  proyecto, una por unidad (contrato 0.46.0). `lineas[].precio` es el de
   *  UNA pieza en centavos, con el descuento ya repartido. Devuelve la
   *  respuesta entera para que la hoja pueda decir por qué no se pudo. */
  async aprobar(cotizacion_id, proyecto_id, lineas) {
    await identidad();
    return pedir(`/orgs/${ORG}/cotizaciones/${encodeURIComponent(cotizacion_id)}/aprobar`, {
      method: 'POST', cuerpo: { proyecto_id, lineas },
    });
  },

  async clientesParecidos(nombre) {
    try {
      await identidad();
      const r = await pedir(`/orgs/${ORG}/clientes/parecidos?nombre=${encodeURIComponent(nombre)}&negocio_id=${encodeURIComponent(NEGOCIO)}`);
      return r.data?.parecidos || [];
    } catch (e) {
      console.error('clientesParecidos:', e);
      return [];
    }
  },

  /** Aparta el número del recibo. Lo da la suite, uno por uno: antes lo
   *  calculaba este navegador —leer, sumar uno, guardar— y dos personas
   *  haciendo un recibo a la vez se llevaban el mismo. */
  async obtenerProximoFolio() {
    await identidad();
    const r = await pedir(`/orgs/${ORG}/folios/REC`, { method: 'POST' });
    if (r.estado !== 201 || !r.data?.numero) throw new Error('no se pudo apartar el folio del recibo');
    return String(r.data.numero).padStart(4, '0');
  },
};

/** Baja el detalle de una versión que vive en un archivo aparte.
 *
 *  HOY NO SE USA, y conviene decirlo en vez de dejarlo pareciendo vivo: desde
 *  esta versión las versiones van completas dentro de la cotización, así que
 *  ninguna trae `historicoURL`. Existía porque Firestore no deja pasar un
 *  documento de más de 1 MB y las versiones viejas se mandaban a Firebase
 *  Storage para que el árbol cupiera.
 *
 *  Se queda porque dos pantallas todavía preguntan por `historicoURL`, y
 *  quitarles esa rama es cirugía en código ya compilado —más riesgo que
 *  provecho—. Un `fetch` pelón sirve igual para una dirección de la suite que
 *  para una vieja de Firebase, por si algún día se importa un árbol viejo. */
async function downloadJSONFromStorage(url) {
  const r = await fetch(url, { credentials: 'same-origin' });
  if (!r.ok) throw new Error('no se pudo bajar la versión: ' + r.status);
  return r.json();
}

async function guardarAjuste(clave, valor) {
  try {
    await identidad();
    // Un solo POST: el id del ajuste lo arma la suite con la app y la clave, y
    // vuelve a guardar la misma gaveta. No hay que preguntar si ya existía.
    const r = await pedir(`/orgs/${ORG}/ajustes`, { method: 'POST', cuerpo: { clave, valor } });
    return r.estado === 201;
  } catch (e) {
    console.error('guardarAjuste ' + clave + ':', e);
    return false;
  }
}

const {
  useState,
  useEffect,
  useLayoutEffect,
  useRef
} = React;

/* ─────────────── el «atrás» del navegador ───────────────
 *
 * Mike, 22-sep-2026: «en todas las apps, cuando picas el botón de back en el
 * navegador te saca hasta la página anterior (…). Queremos que cuando picas
 * back te regrese a la función anterior. Hay funciones que son 3 o 4 clicks
 * para llegar y si le picas back al navegador te saca y pierdes la ruta de
 * navegación que habías hecho».
 *
 * Aquí lo hondo son las cosas que se abren ENCIMA y tapan todo: el cotizador,
 * la configuración, el recibo. Y dentro del cotizador, editar un mueble tapa
 * la lista de muebles. Hasta hoy, «atrás» con cualquiera de esas abierta se
 * llevaba la app entera y había que volver a entrar.
 *
 * Es la misma idea de quell101 y peek101, con una pieza que allá no hacía
 * falta: aquí las cosas SE ANIDAN —se edita un mueble dentro del cotizador—,
 * así que se lleva una PILA y un «atrás» cierra UNA sola, la de más arriba.
 *
 * Y una segunda: el cotizador ya tenía su propio «Volver» encadenado —con un
 * mueble abierto, «Volver» regresa a la lista en vez de cerrar—. El «atrás»
 * del navegador pasa por esa MISMA cadena: si ella dice «todavía no cierro,
 * nada más me hice para atrás un paso», se vuelve a empujar la entrada, para
 * que el siguiente «atrás» sí cierre. Dos caminos distintos que hacen lo
 * mismo son dos comportamientos que se van a separar; uno solo, no. */
const pilaEncima = [];
/* Cuántos «atrás» pidió la propia app al cerrar algo con su botón. Ese
 * `history.back()` también dispara `popstate`, y sin esta cuenta el listener
 * lo leía como un «atrás» de la persona y cerraba lo que quedaba DEBAJO: cerrar
 * el catálogo de la hoja cerraba también la cotización. No se notaba mientras
 * sólo se abría algo encima del menú, donde abajo no hay nada que cerrar. */
let atrasPropios = 0;

function abrirEncima(cerrar) {
  const yo = { cerrar, vivo: true };
  pilaEncima.push(yo);
  history.pushState({ ...(history.state || {}), encima: pilaEncima.length }, '', null);
  return () => {
    if (!yo.vivo) return;
    yo.vivo = false;
    const i = pilaEncima.indexOf(yo);
    if (i >= 0) pilaEncima.splice(i, 1);
    atrasPropios++;
    history.back();
  };
}

window.addEventListener('popstate', () => {
  if (atrasPropios > 0) { atrasPropios--; return; }
  const arriba = pilaEncima[pilaEncima.length - 1];
  if (!arriba || !arriba.vivo) return;
  /* Si al cerrar contesta `true`, no se cerró: nada más se hizo para atrás un
   * paso por dentro (por ejemplo, de editar un mueble a la lista de muebles).
   * Sigue habiendo algo encima, así que se le devuelve su entrada. */
  if (arriba.cerrar() === true) {
    history.pushState({ ...(history.state || {}), encima: pilaEncima.length }, '', null);
    return;
  }
  arriba.vivo = false;
  pilaEncima.pop();
});

/** Lo mismo, para un componente: mientras `abierto`, hay algo encima. */
function useEncima(abierto, cerrar) {
  // La función de cerrar cambia en cada pintada; guardarla en un ref evita que
  // el efecto se desmonte y se vuelva a montar, lo que empujaría una entrada
  // de historial por cada pintada.
  const ref = useRef(cerrar);
  ref.current = cerrar;
  useEffect(() => {
    if (!abierto) return undefined;
    return abrirEncima(() => ref.current());
  }, [abierto]);
}

  return Object.assign({

 *  ventana aparte, igual que los demás PDF de la app, porque la hoja vive
 *  dentro de un panel animado que la impresión del navegador no respeta. */
function imprimirHoja(nodo, titulo) {
  if (!nodo) return;
  const copia = nodo.cloneNode(true);
  copia.querySelectorAll(".no-print").forEach(e => e.remove());
  copia.querySelectorAll("input,textarea,select").forEach(e => {
    const vivo = nodo.querySelector('[data-campo="' + e.getAttribute("data-campo") + '"]');
    const v = vivo ? vivo.value : e.value;
    const s = document.createElement("div");
    s.className = e.className.replace("input", "valor");
    s.setAttribute("style", (e.getAttribute("style") || "") + ";white-space:pre-wrap;min-height:0");
    s.textContent = e.type === "date" && v ? new Date(v + "T12:00:00").toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" }) : v;
    e.replaceWith(s);
  });
  const w = window.open("", "_blank");
  if (!w) return;

}

o cubre el costo del servicio de correcci\u00f3n de la lista de detalles levantados y aprobados formalmente.</li><li style=\"margin-bottom:6px\"><strong>VI. Entrega final del mobiliario.</strong> Concluida la atenci\u00f3n de detalles, se realizar\u00e1 la entrega formal del mobiliario al residente o encargado, firmando la constancia de recepci\u00f3n y conformidad total del proyecto.</li><li><strong>VII. 10\u0025 \u2014 Pago de finiquito y activaci\u00f3n de garant\u00eda.</strong> El diez por ciento (10%) restante constituye el finiquito del proyecto. Su pago activa formalmente la garant\u00eda de manufactura y calidad, as\u00ed como el servicio postventa descrito en la secci\u00f3n correspondiente.</li></ul>")
