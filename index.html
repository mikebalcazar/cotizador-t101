<!-- ── DISEÑO G1 — AURORA FROSTED ──────────────────────────────── -->
<style>
.num, .num *, span.num, div.num { font-family: 'Sansation', 'Raleway', sans-serif !important; font-feature-settings: "tnum" 1; }
body {
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: -10%;
  background-color: #0a1828;
  background-image:
    radial-gradient(circle at 18% 22%, rgba(0, 153, 214, 0.85) 0%, transparent 38%),
    radial-gradient(circle at 78% 18%, rgba(80, 130, 220, 0.7) 0%, transparent 40%),
    radial-gradient(circle at 88% 75%, rgba(0, 200, 230, 0.75) 0%, transparent 42%),
    radial-gradient(circle at 22% 85%, rgba(100, 90, 200, 0.6) 0%, transparent 45%),
    radial-gradient(circle at 55% 50%, rgba(0, 153, 214, 0.5) 0%, transparent 38%),
    radial-gradient(circle at 65% 92%, rgba(60, 110, 200, 0.55) 0%, transparent 35%),
    linear-gradient(135deg, #0a2540 0%, #15406b 50%, #0a3050 100%);
  filter: saturate(1.1);
  animation: auroraDrift 30s ease-in-out infinite alternate;
  z-index: -1;
}
@keyframes auroraDrift {
  0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
  20%  { transform: translate(3%, -2%) rotate(1deg) scale(1.06); }
  40%  { transform: translate(-2%, 2%) rotate(-0.8deg) scale(1.03); }
  60%  { transform: translate(4%, 1%) rotate(0.6deg) scale(1.05); }
  80%  { transform: translate(-3%, -1%) rotate(-0.5deg) scale(1.04); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1); }
}

/* Partículas flotando hacia arriba — frosted glass enhancement */
body::after {
  content: '';

/* Cards frosted — aplica a cualquier elemento con bg blanco usando data-frost o inline */
.frost {
  background: rgba(255, 255, 255, 0.72) !important;
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.5) !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.7) !important;
}

/* Animación "vacuum" al archivar — el bloque se encoge y vuela hacia el botón de archivos */
@keyframes vacuumToArchive {
  0% {
    transform: translate(0, 0) scale(1) rotate(0deg);
    opacity: 1;
  }
  30% {
    transform: translate(calc(var(--vacuum-dx) * 0.15), calc(var(--vacuum-dy) * 0.15)) scale(0.92) rotate(2deg);
    opacity: 0.95;
  }
  100% {
    transform: translate(var(--vacuum-dx), var(--vacuum-dy)) scale(0.05) rotate(20deg);
    opacity: 0;
  }
}
.cliente-block.archivando {
  animation: vacuumToArchive 0.5s cubic-bezier(0.55, 0.0, 0.7, 0.15) forwards;
  pointer-events: none;
  z-index: 100;
}
.cliente-block:not(.activo):hover {
  box-shadow:
    0 0 0 1px rgba(150,230,255,0.3),
    0 0 18px rgba(150,230,255,0.35),
    0 0 40px rgba(150,230,255,0.22),
    0 0 70px rgba(150,230,255,0.12),
    0 10px 36px rgba(0,0,0,0.15),
    inset 0 1px 0 rgba(255,255,255,0.65) !important;
  background: rgba(255,255,255,0.36) !important;
  border-color: rgba(255,255,255,0.5) !important;
}

/* Indicadores neón */
.neon-circle {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: transparent;
  border: 2px solid #0099D6;
  flex-shrink: 0;
  transition: border-color 0.5s cubic-bezier(0.4, 0.0, 0.2, 1) 0.15s, box-shadow 0.5s cubic-bezier(0.4, 0.0, 0.2, 1) 0.15s;
  display: inline-block;
}
.neon-circle.active {
  border-color: #C6FF3D;
  animation: neonStrobe 0.55s linear, neonPulse 1.8s ease-in-out infinite 0.55s;
  transition: border-color 0.2s ease;
}
@keyframes neonStrobe {
  0%   { box-shadow: 0 0 0 rgba(198,255,61,0); border-color:#C6FF3D; }
  15%  { box-shadow: 0 0 22px 6px rgba(255,255,255,1), 0 0 50px 16px rgba(198,255,61,1), inset 0 0 16px rgba(255,255,255,0.95); border-color:#fff; }
  100% {
    box-shadow:
      0 0 4px rgba(198,255,61,0.9),
      0 0 10px rgba(198,255,61,0.7),
      0 0 18px rgba(198,255,61,0.5),
      0 0 28px rgba(198,255,61,0.3),
      inset 0 0 6px rgba(198,255,61,0.5);
    border-color:#C6FF3D;
  }
}
@keyframes neonPulse {
  0%, 100% {
    box-shadow:
      0 0 3px rgba(198,255,61,0.7),
      0 0 8px rgba(198,255,61,0.5),
      0 0 14px rgba(198,255,61,0.35),
      0 0 22px rgba(198,255,61,0.2),
      inset 0 0 4px rgba(198,255,61,0.4);
  }
  50% {
    box-shadow:
      0 0 8px rgba(198,255,61,1),
      0 0 18px rgba(198,255,61,0.95),
      0 0 32px rgba(198,255,61,0.75),
      0 0 48px rgba(198,255,61,0.5),
      inset 0 0 10px rgba(198,255,61,0.75);
  }
}

  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInUp {

}
.anim-slideDown { animation: slideDown 0.46s cubic-bezier(0.4, 0.0, 0.2, 1) forwards; }
.anim-fadeInUp { animation: fadeInUp 0.4s ease forwards; }

<body style="margin:0;color:#2C2C2C;">
<div id="root"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#fff;font-family:Raleway,sans-serif;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,0.3)">Cargando Taller 101...</div></div>

<script>
// Firestore REST API — no requiere SDK, funciona desde file://
const FS_PROJECT = "cotizador-t101";
const FS_KEY = "AIzaSyAlYppIutsXpe-lc2WTqbFQ_dz8rOrUxKM";
const FS_DOC = `https://firestore.googleapis.com/v1/projects/${FS_PROJECT}/databases/(default)/documents/app/datos?key=${FS_KEY}`;

// Firebase Storage (para imágenes de muebles)
const FS_BUCKET = "cotizador-t101.firebasestorage.app";

// Sube base64 a Storage, devuelve URL pública. Si falla, lanza error con detalles.
async function uploadToStorage(b64) {
  if (typeof b64 !== "string" || !b64.startsWith("data:image")) return b64;
  const m = b64.match(/^data:(image\/\w+);base64,(.+)$/);
  if (!m) throw new Error("Formato base64 inválido");
  const mimeType = m[1];
  const ext = mimeType.split("/")[1].replace("jpeg","jpg");

  // base64 → Blob
  const binary = atob(m[2]);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  const blob = new Blob([bytes], {type: mimeType});

  const path = `muebles/${Date.now()}-${Math.random().toString(36).slice(2,10)}.${ext}`;
  const upUrl = `https://firebasestorage.googleapis.com/v0/b/${FS_BUCKET}/o?uploadType=media&name=${encodeURIComponent(path)}`;
  let r;
  try {
    r = await fetch(upUrl, {method:"POST", headers:{"Content-Type": mimeType}, body: blob});
  } catch(e) {
    throw new Error("Red/CORS: " + e.message);
  }
  if (!r.ok) {
    let detalle = "HTTP " + r.status;
    try {
      const errBody = await r.text();
      detalle += " — " + errBody.slice(0, 300);
    } catch(e){}
    throw new Error(detalle);
  }
  const data = await r.json();
  const token = data.downloadTokens;
  if (!token) throw new Error("Sin downloadToken en respuesta de Storage");
  return `https://firebasestorage.googleapis.com/v0/b/${FS_BUCKET}/o/${encodeURIComponent(path)}?alt=media&token=${token}`;
}

// Sube objeto JSON a Storage como archivo .json, devuelve URL pública
async function uploadJSONToStorage(obj) {
  const json = JSON.stringify(obj);
  const blob = new Blob([json], {type: "application/json"});
  const path = `versiones/${Date.now()}-${Math.random().toString(36).slice(2,10)}.json`;
  const upUrl = `https://firebasestorage.googleapis.com/v0/b/${FS_BUCKET}/o?uploadType=media&name=${encodeURIComponent(path)}`;
  let r;
  try {
    r = await fetch(upUrl, {method:"POST", headers:{"Content-Type":"application/json"}, body: blob});
  } catch(e) { throw new Error("Red/CORS: "+e.message); }
  if (!r.ok) {
    let detalle = "HTTP "+r.status;
    try { detalle += " — " + (await r.text()).slice(0,300); } catch(e){}
    throw new Error(detalle);
  }
  const data = await r.json();
  const token = data.downloadTokens;
  if (!token) throw new Error("Sin downloadToken en JSON upload");
  return `https://firebasestorage.googleapis.com/v0/b/${FS_BUCKET}/o/${encodeURIComponent(path)}?alt=media&token=${token}`;
}

// Descarga JSON desde una URL de Storage
async function downloadJSONFromStorage(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("Download JSON HTTP "+r.status);
  return r.json();
}

// Convierte valor JS → Firestore Value
function toFS(v) {
  if (v === null || v === undefined) return {nullValue: null};
  if (typeof v === "boolean") return {booleanValue: v};
  if (typeof v === "number") return Number.isInteger(v) ? {integerValue: String(v)} : {doubleValue: v};
  if (typeof v === "string") return {stringValue: v};
  if (Array.isArray(v)) return {arrayValue: {values: v.map(toFS)}};
  if (typeof v === "object") return {mapValue: {fields: Object.fromEntries(Object.entries(v).map(([k,val])=>[k,toFS(val)]))}};
  return {stringValue: String(v)};
}

// Convierte Firestore Value → JS
function fromFS(v) {
  if (!v) return null;
  if ("nullValue" in v) return null;
  if ("booleanValue" in v) return v.booleanValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("stringValue" in v) return v.stringValue;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(fromFS);
  if ("mapValue" in v) return Object.fromEntries(Object.entries(v.mapValue.fields || {}).map(([k,val])=>[k,fromFS(val)]));
  return null;
}

window.firebaseDB = {
  async cargar() {
    try {
      const r = await fetch(FS_DOC);
      if (r.status === 404) return {clientes:[], config:null, prices:null};
      const data = await r.json();
      if (data.error) return {clientes:[], config:null, prices:null};
      const fields = data.fields || {};
      return {
        clientes: fromFS(fields.clientes) || [],
        config: fromFS(fields.config) || null,
        prices: fromFS(fields.prices) || null
      };
    } catch(e) { console.error("Error cargando:", e); return {clientes:[], config:null, prices:null}; }
  },
  async guardarConfig(config) {
    try {
      const url = FS_DOC + "&updateMask.fieldPaths=config";
      const body = {fields: {config: toFS(config)}};
      const r = await fetch(url, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      if(!r.ok) { console.error("guardarConfig:", r.status, await r.text()); }
      return r.ok;
    } catch(e) { console.error("Error guardando config:", e); return false; }
  },
  async guardarPrices(prices) {
    try {
      const url = FS_DOC + "&updateMask.fieldPaths=prices";
      const body = {fields: {prices: toFS(prices)}};
      const r = await fetch(url, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      if(!r.ok) { console.error("guardarPrices:", r.status, await r.text()); }
      return r.ok;
    } catch(e) { console.error("Error guardando prices:", e); return false; }
  },
  async obtenerProximoFolio() {
    // Lee folio actual de Firestore, incrementa y persiste atómicamente
    try {
      const r = await fetch(FS_DOC);
      const data = r.ok ? await r.json() : {};
      const fields = data.fields || {};
      const actual = parseInt(fromFS(fields.reciboCounter)||0, 10);
      const nuevo = actual + 1;
      const url = FS_DOC + "&updateMask.fieldPaths=reciboCounter";
      const body = {fields: {reciboCounter: toFS(nuevo)}};
      await fetch(url, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
      return String(nuevo).padStart(4,"0");
    } catch(e) { console.error("obtenerProximoFolio:", e); return String(Date.now()).slice(-4); }
  },
  async leerFolioActual() {
    try {
      const r = await fetch(FS_DOC);
      const data = r.ok ? await r.json() : {};
      const actual = parseInt(fromFS(data.fields?.reciboCounter)||0, 10);
      return String(actual+1).padStart(4,"0");
    } catch(e) { return "0001"; }
  },
  async guardar(clientes) {
    try {
      let storageErr = null;
      let stats = {b64:0, url:0, otra:0, fallos:0, exitos:0};

      // Migra imágenes legacy (base64) a Storage. URLs ya subidas se dejan tal cual.
      const migrarImg = async (img) => {
        if (typeof img !== "string") { stats.otra++; return img; }
        if (img.startsWith("https://")) { stats.url++; return img; }
        if (img.startsWith("data:image")) {
          stats.b64++;
          try {
            const r = await uploadToStorage(img);
            stats.exitos++;
            return r;
          } catch(e) {
            stats.fallos++;
            if (!storageErr) storageErr = e.message || String(e);
            console.warn("No se pudo migrar legacy base64 a Storage:", e);
            return img;
          }
        }
        stats.otra++;
        return img;
      };

      // Recompresión de emergencia para base64 que no se pudo migrar
      const recompImgLevel = (b64, maxPx, q) => new Promise(res => {
        if (!b64 || !b64.startsWith("data:image")) return res(b64);
        const img = new Image();
        img.onload = () => {
          const cv = document.createElement("canvas");
          let w = img.width, h = img.height;
          if(w > maxPx){h = Math.round(h*maxPx/w); w = maxPx;}
          if(h > maxPx){w = Math.round(w*maxPx/h); h = maxPx;}
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          res(cv.toDataURL("image/jpeg", q));
        };
        img.onerror = () => res(b64);
        img.src = b64;
      });

      const procesarImg = async (img, lvlPx, lvlQ) => {
        const migrada = await migrarImg(img);
        if (migrada.startsWith("https://")) return migrada;  // ya es URL, no recomprimir
        // Si quedó como base64 (Storage falló), recomprimir
        return recompImgLevel(migrada, lvlPx, lvlQ);
      };

      const procesarTree = async (lvlPx, lvlQ) => Promise.all(clientes.map(async c => ({
        ...c,
        proyectos: await Promise.all((c.proyectos||[]).map(async p => ({
          ...p,
          cotizaciones: await Promise.all((p.cotizaciones||[]).map(async cot => ({
            ...cot,
            versiones: await Promise.all((cot.versiones||[]).map(async (v,vi) => {
              if (vi === 0) {
                // Versión actual: estructura completa, imágenes migradas
                return {
                  ...v,
                  muebles: await Promise.all((v.muebles||[]).map(async m => ({
                    ...m,
                    imagenes: await Promise.all((m.imagenes||[]).map(b=>procesarImg(b,lvlPx,lvlQ)))
                  })))
                };
              }
              // Versión histórica
              if (v.historicoURL) {
                // Ya está en Storage como JSON, dejar tal cual
                return v;
              }
              // Subir versión completa a Storage como JSON
              try {
                // Migrar imágenes de la versión histórica también
                const versionMigrada = {
                  ...v,
                  muebles: await Promise.all((v.muebles||[]).map(async m => ({
                    ...m,
                    imagenes: await Promise.all((m.imagenes||[]).map(b=>migrarImg(b)))
                  })))
                };
                const url = await uploadJSONToStorage(versionMigrada);
                const total = (v.muebles||[]).reduce((s,m) => s + (m.total||0)*(m.qty||1), 0);
                return {
                  fecha: v.fecha,
                  folio: v.folio,
                  archivada: v.archivada,
                  historicoURL: url,
                  resumen: { muebles: v.muebles?.length || 0, total }
                };
              } catch(e) {
                console.warn("No se subió versión histórica a Storage:", e);
                if (!storageErr) storageErr = e.message || String(e);
                // Fallback: resumen reducido (sin detalle)
                return {
                  fecha: v.fecha,
                  folio: v.folio,
                  archivada: v.archivada,
                  muebles: (v.muebles||[]).map(m => ({nombre: m.nombre, total: m.total||0, qty: m.qty||1}))
                };
              }
            }))
          })))
        })))
      })));

      // Con Storage, la primera pasada ya deja todo como URLs. Las legacy se migran.
      // Si Storage está caído, el fallback recomprime escalonadamente.
      const niveles = [
        {px:200, q:0.35},
        {px:150, q:0.30},
        {px:120, q:0.25},
        {px:90,  q:0.22}
      ];
      let compressed=null, bodyStr=null, sizeKB=0;
      for(let idx=0; idx<niveles.length; idx++){
        const n = niveles[idx];
        // Stats solo en la primera pasada (sino contaríamos 4x)
        if(idx>0) stats = {b64:0,url:0,otra:0,fallos:0,exitos:0};
        compressed = await procesarTree(n.px, n.q);
        const body = {fields:{clientes:toFS(compressed), updatedAt:toFS(new Date().toISOString())}};
        bodyStr = JSON.stringify(body);
        sizeKB = Math.round(bodyStr.length / 1024);
        if(bodyStr.length <= 1000000) break;
      }

      const statsStr = `\n\n📊 Imágenes:\n  Base64 (legacy): ${stats.b64}\n  URLs (Storage): ${stats.url}\n  Subidas OK: ${stats.exitos}\n  Subidas fallidas: ${stats.fallos}\n  Otras: ${stats.otra}`;
      console.log("Stats guardado:", stats, "sizeKB:", sizeKB);

      if(bodyStr.length > 1000000) {
        const errInfo = storageErr ? ("\n\n🔍 Error de Storage:\n" + storageErr) : "";
        alert("❌ Los datos pesan "+sizeKB+"KB, sobre el límite de 1MB."+errInfo+statsStr+"\n\nBucket: "+FS_BUCKET);
        return false;
      }
      // updateMask para PATCH parcial: solo toca clientes y updatedAt (preserva config)
      const r = await fetch(FS_DOC+"&updateMask.fieldPaths=clientes&updateMask.fieldPaths=updatedAt", {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: bodyStr
      });
      if(!r.ok) { const err=await r.text(); console.error("Firestore error:",r.status,err); }
      return r.ok;
    } catch(e) { console.error("Error guardando:", e); return false; }
  }
};
</script>
