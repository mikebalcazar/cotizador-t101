# Publica quote101 en Cloudflare y mide lo que publicó.
#
# Fase 1 de la migración: el Worker sirve la misma app de siempre y le abre la
# puerta a la suite por `/s101/*`. **El sitio de Netlify sigue vivo al lado**
# (D3): esto no apaga nada. Apagarlo es de Mike, y es lo último (fase 5).
#
# Secretos del repositorio:
#   CLOUDFLARE_API_TOKEN    Workers Scripts:Edit, Account Settings:Read,
#                           User Details:Read
#   CLOUDFLARE_ACCOUNT_ID
#
# Si falta alguno, el guardián de abajo lo dice por su nombre en el comentario
# del commit, que es lo que el chat puede leer. Es la lección de peek101 el
# 12-sep: el aviso salía sólo al log de Actions y al chat le llegaba «el flujo
# se cayó antes de medir», que es cierto e inútil.

name: Publicar quote101

on:
  push:
    branches: [main]
    paths-ignore:
      - 'claude/**'
      - '**.md'
  workflow_dispatch:

defaults:
  run:
    # `node ... | tee` devuelve el código de `tee`, que siempre es 0. Sin
    # pipefail, una medición en ROJO pasa por verde — y eso fue exactamente lo
    # que pasó en el run 1: staging midió cuatro fallas y el paso salió bien.
    # Es el mismo defecto que se le corrigió a `revisar.sh` de taller101 unas
    # horas antes, en otra forma.
    shell: bash -euo pipefail {0}

concurrency:
  group: publicar-quote101
  cancel-in-progress: false

jobs:
  # Las pruebas van ANTES de publicar. Aquí sí hay internet, así que
  # `EXIGIR_INTERNET=1` obliga a medir el camino de datos de verdad: en la
  # máquina del chat el navegador no sale, y sin esta bandera el modo «no se
  # pudo medir» sería un agujero por donde la prueba pasa siempre.
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Traer el navegador
        run: npx playwright install chromium --with-deps
      - name: Armar lo que se publica
        run: node scripts/armar.mjs
      - name: Paridad con Netlify y que la app arranque
        env:
          EXIGIR_INTERNET: '1'
        run: node --test pruebas/paridad.spec.mjs

  publicar:
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Revisar que estén las llaves
        run: |
          set -u
          faltan=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || faltan="$faltan CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || faltan="$faltan CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$faltan" ]; then
            {
              echo "FALTA CON QUÉ PUBLICAR"
              echo
              echo "Secretos que el repositorio cotizador-t101 no tiene:$faltan"
              echo
              echo "Los pone Mike, una sola vez, en:"
              echo "  github.com/mikebalcazar/cotizador-t101/settings/secrets/actions"
              echo "Son los MISMOS valores que ya tienen suite101-api y descargas."
              echo "El token necesita Workers Scripts:Edit, Account Settings:Read"
              echo "y User Details:Read."
              echo
              echo "No se publicó nada. El chat no lee ni lista secretos: sólo"
              echo "pregunta si están, y este renglón es la respuesta."
            } | tee /tmp/salida.txt
            exit 1
          fi
          echo "las dos llaves están puestas" | tee -a /tmp/salida.txt

      - name: Armar lo que se publica
        run: node scripts/armar.mjs | tee -a /tmp/salida.txt

      - name: Publicar en staging
        run: npx wrangler deploy --env staging 2>&1 | tee -a /tmp/salida.txt

      # Si staging mide rojo, aquí se acaba: a producción sólo llega lo que ya
      # salió verde en staging (D5). Con `pipefail` esto por fin es cierto.
      - name: Medir staging
        id: medir_staging
        run: node scripts/medir.mjs https://quote101-staging.mike-929.workers.dev staging 2>&1 | tee -a /tmp/salida.txt

      # A producción sólo llega lo que ya salió verde en staging (D5).
      - name: Publicar en producción
        run: npx wrangler deploy 2>&1 | tee -a /tmp/salida.txt

      - name: Medir producción
        id: medir_prod
        continue-on-error: true   # para que el comentario del commit se escriba igual
        run: node scripts/medir.mjs https://quote101.mike-929.workers.dev produccion 2>&1 | tee -a /tmp/salida.txt

      # El canal de vuelta (OPERAR §6): el chat no alcanza el log de Actions,
      # pero sí api.github.com.
      - name: Dejar lo medido en el commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          [ -f /tmp/salida.txt ] || echo "No hubo salida que reportar (se cayó antes de medir)." > /tmp/salida.txt
          jq -Rs '{body: ("**quote101 · fase 1**\n\n```\n" + .[-60000:] + "\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_")}' \
            /tmp/salida.txt > /tmp/comentario.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @/tmp/comentario.json -o /tmp/respuesta.json -w 'comentario: %{http_code}\n'
          head -c 200 /tmp/respuesta.json || true

      - name: Que la medición de producción mande
        if: steps.medir_prod.outcome != 'success'
        run: exit 1
