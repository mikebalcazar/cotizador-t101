# Verifica lo publicado cuando quien publica no es GitHub.
#
# Netlify construye por su cuenta al recibir el push, así que aquí no hay un
# trabajo que esperar: se espera un rato y luego se mide. Si el sitio tarda más
# de lo normal, el run sale rojo y hay que volver a dispararlo a mano.

name: Verificar lo publicado

on:
  push:
    branches: [main]
    # Netlify construye cuando cambia lo que sirve. Un archivo de texto no
    # cambia nada de lo publicado, y este flujo se pasa dos minutos durmiendo
    # antes de medir: dispararlo por una nota es gasto a cambio de nada.
    #
    # Se midió el 12-sep: un commit que sólo tocaba `claude/` disparó este
    # flujo. Es el mismo defecto que ya se cerró en bitacora-obra, taller101 y
    # suite101-api; este repositorio se había quedado fuera.
    #
    # `**.md` en vez de nombrar archivos uno por uno: en los otros repos la
    # lista enumeraba y por ahí se colaba cada archivo nuevo.
    paths-ignore:
      - 'claude/**'
      - '**.md'
  workflow_dispatch:

jobs:
  esperar:
    runs-on: ubuntu-latest
    steps:
      - name: Darle tiempo a la construcción de afuera
        run: sleep 120

  verificar:
    needs: esperar
    uses: ./.github/workflows/verificar.yml
    with:
      url: https://cotizador-t101.netlify.app
