# quote101 como Worker de Cloudflare. Decisiones D1 y D2 del arranque.
#
# Dos Workers con el mismo código: `quote101-staging`, que habla con la API de
# staging, y `quote101`, que habla con la de producción. El sitio de Netlify
# (`cotizador-t101.netlify.app`) **sigue vivo al lado** hasta el corte (D3):
# esto no apaga nada.
#
# Las llaves no están aquí ni pueden estarlo: el despliegue lo hace el corredor
# con los secretos de Actions del repositorio.

name = "quote101"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# Lo que se publica lo arma `scripts/armar.mjs` con una lista explícita:
# `index.html`, `fonts/` y la página del 404. **No es la raíz del
# repositorio.** El 12-sep, servir la raíz en Netlify dejó las notas de trabajo
# del chat en internet; aquí no se hereda, se elige.
#
# `run_worker_first` decide qué llega al Worker ANTES que la capa de archivos.
# Con `["/s101/*"]` sólo entraba la puerta a la suite, y todo lo demás —la app
# incluida— lo contestaba la capa de archivos sin pasar por el Worker: el
# candado de la fase 2 nunca corría. Se midió en pruebas el 16-sep, `/`
# contestando 200 sin sesión. Ahora entra todo y el Worker decide.
#
# `html_handling = "none"` sirve las rutas tal cual. Con el valor de fábrica,
# `/entrar.html` se redirige a `/entrar`, y como `/entrar` no está en la lista
# de lo abierto, el Worker lo mandaría otra vez a `/entrar.html`: un rebote
# infinito en la propia pantalla de entrada. Sirviendo literal no hay a dónde
# rebotar, y a cambio el Worker mapea `/` a `/index.html` él mismo.
[assets]
directory = "./publicar"
binding = "ASSETS"
run_worker_first = ["/*"]
html_handling = "none"

# La API, desde el mismo origen. No hay URL: es un *service binding*.
[[services]]
binding = "API"
service = "suite101-api"

[observability]
enabled = true

# ─────────────── staging ───────────────
# Todo se prueba aquí primero (D5), contra la org `demo` (D6).

[env.staging]
name = "quote101-staging"

[env.staging.assets]
directory = "./publicar"
binding = "ASSETS"
run_worker_first = ["/*"]
html_handling = "none"

[[env.staging.services]]
binding = "API"
service = "suite101-api-staging"

[env.staging.observability]
enabled = true
